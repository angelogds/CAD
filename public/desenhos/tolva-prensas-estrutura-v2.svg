<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="t-title t-desc">
<title id="t-title">Tolva homogeneizadora das prensas — elevação sobre estrutura, planta e vista frontal</title>
<desc id="t-desc">Detalhamento conceitual da tolva FAST de duas roscas horizontais: carcaça, quatro tampas, dois motoredutores em uma extremidade, três descargas inferiores com guilhotinas e alimentação gravítica às prensas FAST, P50 e P46. A tolva se apoia em estrutura metálica independente, cuja altura e seções exigem levantamento e cálculo.</desc>

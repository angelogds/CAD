name: Graphify - mapa remoto (piloto)

# Primeiro teste no PR; depois, execucao manual pela aba Actions.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/graphify-map.yml'
      - 'docs/GRAPHIFY_REMOTO.md'
      - 'AGENTS.md'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: graphify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mapa-codigo:
    name: Gerar mapa de codigo (somente leitura)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout sem credenciais persistidas
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar versao fixa do Graphify
        run: python -m pip install graphifyy==0.9.92

      - name: Construir grafo (sem modelo ou API externa)
        shell: bash
        run: |
          set -euo pipefail
          graphify --version
          graphify extract . --code-only
          graphify cluster-only . --no-label
          graphify export html

      - name: Validar arquivos gerados
        shell: bash
        run: |
          set -euo pipefail
          test -s graphify-out/graph.json
          test -s graphify-out/graph.html
          ls -lh graphify-out/

      - name: Disponibilizar mapa no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: graphify-codigo-${{ github.run_id }}
          path: |
            graphify-out/graph.json
            graphify-out/graph.html
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: error
          retention-days: 7
